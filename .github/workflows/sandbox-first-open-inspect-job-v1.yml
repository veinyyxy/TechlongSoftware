name: Sandbox first open — inspect
on:
  workflow_call:
    inputs:
      pair_sha: { type: string, required: true }
      release_sha: { type: string, required: true }
      inspect_run: { type: string, required: true }
permissions:
  actions: read
  contents: read
  id-token: write
jobs:
  bound-first-open:
    if: inputs.inspect_run == '0' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && github.repository_id == '1323312747' && github.repository_owner_id == '14145707' && github.actor_id == '14145707'
    environment: techlong-sandbox-deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Require protected launch coordinates
        shell: bash
        env:
          EXPECTED: ${{ vars.TECHLONG_FIRST_OPEN_APPROVED_RELEASE_SHA256 }}
          EXPECTED_LAUNCH: ${{ vars.TECHLONG_FIRST_OPEN_APPROVED_LAUNCH_SHA256 }}
          COMMIT: ${{ vars.TECHLONG_FIRST_OPEN_RUNTIME_COMMIT }}
          REQUESTED: ${{ inputs.release_sha }}
          PAIR: ${{ inputs.pair_sha }}
          INSPECT_RUN: ${{ inputs.inspect_run }}
        run: |
          [[ "$EXPECTED" =~ ^[a-f0-9]{64}$ && "$EXPECTED_LAUNCH" =~ ^[a-f0-9]{64}$ ]]
          [[ "$REQUESTED" == "$EXPECTED" && "$COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$PAIR" =~ ^[a-f0-9]{64}$ && "$INSPECT_RUN" == '0' ]]
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ vars.TECHLONG_FIRST_OPEN_RUNTIME_COMMIT }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.19.0'
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: veinyyxy/SpeedFeast_Backend_main
          ref: b9ca2138738900afc23a6a2ddce141b37a1f0a31
          token: ${{ secrets.TECHLONG_FIRST_OPEN_BACKEND_READ_TOKEN || github.token }}
          path: .first-open-backend
          persist-credentials: false
      - name: Prepare exact A dependencies
        shell: bash
        run: |
          test "$(git -C .first-open-backend rev-parse HEAD)" = b9ca2138738900afc23a6a2ddce141b37a1f0a31
          npm ci --prefix .first-open-backend --omit=dev --ignore-scripts --no-audit --no-fund
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: actions/upload-artifact
          ref: b7c566a772e6b6bfb58ed0dc250532a479d7789f
          path: .first-open-artifact-action
          persist-credentials: false
      - name: Load pinned code dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Launch only inspect
        uses: ./.github/actions/first-open-launch
        with:
          role: inspect
        env:
          GH_TOKEN: ${{ github.token }}
          FIRST_OPEN_APPROVED_RELEASE_SHA256: ${{ vars.TECHLONG_FIRST_OPEN_APPROVED_RELEASE_SHA256 }}
          FIRST_OPEN_APPROVED_LAUNCH_SHA256: ${{ vars.TECHLONG_FIRST_OPEN_APPROVED_LAUNCH_SHA256 }}
          FIRST_OPEN_EXPECTED_RUNTIME_COMMIT: ${{ vars.TECHLONG_FIRST_OPEN_RUNTIME_COMMIT }}
          FIRST_OPEN_PROTECTED_RECORD: ${{ secrets.TECHLONG_FIRST_OPEN_PROTECTED_RECORD }}
          FIRST_OPEN_PROTECTED_HOST_B64: ${{ secrets.TECHLONG_FIRST_OPEN_INSPECT_HOST_B64 }}
          FIRST_OPEN_PAIR: ${{ inputs.pair_sha }}
          FIRST_OPEN_RELEASE: ${{ inputs.release_sha }}
          FIRST_OPEN_INSPECT_RUN: ${{ inputs.inspect_run }}
  bound-install-readback:
    if: inputs.inspect_run == 'install-readback' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && github.repository_id == '1323312747' && github.repository_owner_id == '14145707' && github.actor_id == '14145707'
    environment: techlong-sandbox-deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Require approved installation readback
        env:
          APPROVED: ${{ vars.TECHLONG_FIRST_OPEN_INSTALL_READBACK_PLAN_SHA256 }}
          REQUESTED: ${{ inputs.pair_sha }}
          COMMIT: ${{ vars.TECHLONG_FIRST_OPEN_INSTALL_RUNTIME_COMMIT }}
          APPROVED_RUN: ${{ vars.TECHLONG_FIRST_OPEN_INSTALL_READBACK_RUN_ID }}
        run: |
          [[ "$APPROVED" =~ ^[a-f0-9]{64}$ && "$REQUESTED" == "$APPROVED" && "$COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$APPROVED_RUN" == "$GITHUB_RUN_ID" ]]
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ vars.TECHLONG_FIRST_OPEN_INSTALL_RUNTIME_COMMIT }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.19.0'
      - name: Load pinned readback dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: actions/upload-artifact
          ref: b7c566a772e6b6bfb58ed0dc250532a479d7789f
          path: .first-open-artifact-action
          persist-credentials: false
      - name: Observe the exact grant and relock, no claim
        id: observe
        uses: ./.github/actions/first-open-launch
        with:
          role: install-readback
        env:
          FIRST_OPEN_INSTALL_APPROVED_PLAN_SHA256: ${{ vars.TECHLONG_FIRST_OPEN_INSTALL_READBACK_PLAN_SHA256 }}
          FIRST_OPEN_INSTALL_APPROVED_RUN_ID: ${{ vars.TECHLONG_FIRST_OPEN_INSTALL_READBACK_RUN_ID }}
          FIRST_OPEN_INSTALL_PROTECTED_PLAN: ${{ secrets.TECHLONG_FIRST_OPEN_INSTALL_READBACK_PLAN }}
          FIRST_OPEN_INSTALL_RUNTIME_COMMIT: ${{ vars.TECHLONG_FIRST_OPEN_INSTALL_RUNTIME_COMMIT }}
          FIRST_OPEN_INSTALL_REQUESTED_PLAN_SHA256: ${{ inputs.pair_sha }}
          FIRST_OPEN_INSTALL_REQUESTED_RELEASE_SHA256: ${{ inputs.release_sha }}
      - name: Save the sanitized installation readback
        if: always() && (steps.observe.outcome == 'success' || steps.observe.outcome == 'failure')
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: fc41597f-install-readback-${{ vars.TECHLONG_FIRST_OPEN_INSTALL_READBACK_PLAN_SHA256 }}
          path: ${{ runner.temp }}/fc41597f-install-readback.json
          if-no-files-found: ignore
          retention-days: 1
          overwrite: false
