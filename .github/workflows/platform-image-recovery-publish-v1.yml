name: Platform single recovery ECR publication v1
run-name: Platform recovery ECR ${{ inputs.review_sha }}
on:
  workflow_dispatch:
    inputs:
      review_json:
        description: Exact Source review; never generic approval
        type: string
        required: true
      review_sha:
        description: SHA256 of exact review_json bytes
        type: string
        required: true
permissions: {}
jobs:
  reviewed-publication:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: veinyyxy/TechlongSoftware/.github/workflows/platform-image-recovery-publish-job-v1.yml@9b26b7c7d16929d50c0e14e05d92f1e7fe40eb75
    with:
      review_json: ${{ inputs.review_json }}
      review_sha: ${{ inputs.review_sha }}
