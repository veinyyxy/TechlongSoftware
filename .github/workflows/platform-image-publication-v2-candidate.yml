name: Platform Alpine publication candidate - No AWS
on:
  push:
    branches: [main]
    paths:
      - 'ops/platform-image-publication-v2/**'
      - 'tests/platform-image-publication-v2.test.mjs'
      - '.github/workflows/platform-image-publication-v2-candidate.yml'
      - '.github/workflows/platform-image-publish-job-v2.yml'
  pull_request:
    paths:
      - 'ops/platform-image-publication-v2/**'
      - 'tests/platform-image-publication-v2.test.mjs'
      - '.github/workflows/platform-image-publication-v2-candidate.yml'
      - '.github/workflows/platform-image-publish-job-v2.yml'
permissions:
  contents: read
concurrency:
  group: platform-publication-v2-candidate-${{ github.sha }}
  cancel-in-progress: false
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test tests/platform-image-publication-v2.test.mjs tests/platform-image-publication.test.mjs
      - run: python3 -B tests/platform-image-extraction_test.py
      - run: |
          node node_modules/typescript/bin/tsc --noEmit --incremental false
          node node_modules/eslint/bin/eslint.js ops/platform-image-publication-v2/ tests/platform-image-publication-v2.test.mjs --max-warnings 0
  exact-image:
    needs: contracts
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.19.0'
      - name: Exact original ZIP and Alpine image, dual smoke and fresh zero-finding scan
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ops/platform-image-publication-v2/cloud-preflight.sh preflight
      - name: Save only small independent preflight evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: platform-publication-v2-preflight-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/platform-publication-v2/verified-artifact.json
            ${{ runner.temp }}/platform-publication-v2/loaded-inspect.json
            ${{ runner.temp }}/platform-publication-v2/verified-preflight.json
          if-no-files-found: warn
          retention-days: 3
          overwrite: false
