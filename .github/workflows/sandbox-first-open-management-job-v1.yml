name: Sandbox first open — management
on:
  workflow_call:
    inputs:
      pair_sha: { type: string, required: true }
      release_sha: { type: string, required: true }
      inspect_run: { type: string, required: true }
permissions:
  actions: read
  contents: read
  id-token: write
jobs:
  bound-first-open:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && github.repository_id == '1323312747' && github.repository_owner_id == '14145707' && github.actor_id == '14145707'
    environment: techlong-sandbox-deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Require protected launch coordinates
        shell: bash
        env:
          EXPECTED: ${{ vars.TECHLONG_FIRST_OPEN_APPROVED_RELEASE_SHA256 }}
          EXPECTED_LAUNCH: ${{ vars.TECHLONG_FIRST_OPEN_APPROVED_LAUNCH_SHA256 }}
          COMMIT: ${{ vars.TECHLONG_FIRST_OPEN_RUNTIME_COMMIT }}
          REQUESTED: ${{ inputs.release_sha }}
        run: |
          [[ "$EXPECTED" =~ ^[a-f0-9]{64}$ && "$EXPECTED_LAUNCH" =~ ^[a-f0-9]{64}$ ]]
          [[ "$REQUESTED" == "$EXPECTED" && "$COMMIT" =~ ^[a-f0-9]{40}$ ]]
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ vars.TECHLONG_FIRST_OPEN_RUNTIME_COMMIT }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.19.0'
      - name: Require the separately protected backend reader
        shell: bash
        env:
          BACKEND_READER: ${{ secrets.TECHLONG_FIRST_OPEN_BACKEND_READ_TOKEN }}
        run: test -n "$BACKEND_READER"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: veinyyxy/SpeedFeast_Backend_main
          ref: b9ca2138738900afc23a6a2ddce141b37a1f0a31
          token: ${{ secrets.TECHLONG_FIRST_OPEN_BACKEND_READ_TOKEN }}
          path: .first-open-backend
          persist-credentials: false
      - name: Prepare exact A dependencies and isolated pg_restore
        shell: bash
        run: |
          test "$(git -C .first-open-backend rev-parse HEAD)" = b9ca2138738900afc23a6a2ddce141b37a1f0a31
          npm ci --prefix .first-open-backend --omit=dev --ignore-scripts --no-audit --no-fund
          /usr/bin/docker pull --platform linux/amd64 'docker.io/library/postgres:16.14-trixie@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b'
          install -m 0700 ops/aws-sandbox/first-open-entry/pg-restore.sh "$RUNNER_TEMP/first-open-pg-restore"
          "$RUNNER_TEMP/first-open-pg-restore" --version
      - name: Load pinned code dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Launch only management
        env:
          GH_TOKEN: ${{ github.token }}
          FIRST_OPEN_APPROVED_RELEASE_SHA256: ${{ vars.TECHLONG_FIRST_OPEN_APPROVED_RELEASE_SHA256 }}
          FIRST_OPEN_APPROVED_LAUNCH_SHA256: ${{ vars.TECHLONG_FIRST_OPEN_APPROVED_LAUNCH_SHA256 }}
          FIRST_OPEN_EXPECTED_RUNTIME_COMMIT: ${{ vars.TECHLONG_FIRST_OPEN_RUNTIME_COMMIT }}
          FIRST_OPEN_PROTECTED_RECORD: ${{ secrets.TECHLONG_FIRST_OPEN_PROTECTED_RECORD }}
          FIRST_OPEN_PROTECTED_HOST_B64: ${{ secrets.TECHLONG_FIRST_OPEN_MANAGEMENT_HOST_B64 }}
          FIRST_OPEN_PAIR: ${{ inputs.pair_sha }}
          FIRST_OPEN_RELEASE: ${{ inputs.release_sha }}
          FIRST_OPEN_INSPECT_RUN: ${{ inputs.inspect_run }}
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types ops/aws-sandbox/first-open-entry/run.ts management
