name: Platform web credential - No AWS
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/platform-web-credential-candidate.yml'
      - 'ops/platform-web-credential-v1/**'
      - 'tests/platform-web-credential-v1.test.mjs'
      - 'scripts/ci/verify-platform-web-credential-v1.mjs'
      - 'docs/aws-platform-hosting-w7m-*.md'
  pull_request:
    paths:
      - '.github/workflows/platform-web-credential-candidate.yml'
      - 'ops/platform-web-credential-v1/**'
      - 'tests/platform-web-credential-v1.test.mjs'
      - 'scripts/ci/verify-platform-web-credential-v1.mjs'
      - 'docs/aws-platform-hosting-w7m-*.md'
permissions:
  contents: read
concurrency:
  group: platform-web-credential-${{ github.sha }}
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: web-credential-ci-only
          POSTGRES_DB: postgres
        ports: ['5432/tcp']
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Secret ordering, approval and no-retry contracts
        run: node --test tests/platform-web-credential-v1.test.mjs
      - name: Real password authentication and one-shot credential flow on PostgreSQL
        env:
          WEB_CREDENTIAL_CI_PORT: ${{ job.services.postgres.ports[5432] }}
        run: node scripts/ci/verify-platform-web-credential-v1.mjs
      - run: npx tsc --noEmit
      - run: npx eslint ops/platform-web-credential-v1 tests/platform-web-credential-v1.test.mjs scripts/ci/verify-platform-web-credential-v1.mjs
