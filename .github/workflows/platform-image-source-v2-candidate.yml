name: Platform Source publication controller - No AWS
on:
  push:
    branches: [main]
    paths:
      - 'ops/platform-image-source-v2/**'
      - 'tests/platform-image-source-v2.test.mjs'
      - '.github/workflows/platform-image-source-v2-candidate.yml'
      - '.github/workflows/platform-image-publish-v2.yml'
      - 'docs/aws-platform-hosting-w7j-source-review.md'
  pull_request:
    paths:
      - 'ops/platform-image-source-v2/**'
      - 'tests/platform-image-source-v2.test.mjs'
      - '.github/workflows/platform-image-source-v2-candidate.yml'
      - '.github/workflows/platform-image-publish-v2.yml'
      - 'docs/aws-platform-hosting-w7j-source-review.md'
permissions:
  contents: read
jobs:
  source-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test tests/platform-image-source-v2.test.mjs tests/platform-image-publication-v2.test.mjs tests/platform-image-publication.test.mjs
      - run: |
          node node_modules/typescript/bin/tsc --noEmit --incremental false
          node node_modules/eslint/bin/eslint.js ops/platform-image-source-v2/ tests/platform-image-source-v2.test.mjs --max-warnings 0
