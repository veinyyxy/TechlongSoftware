name: Platform AWS hosting candidate - No AWS
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/platform-hosting-candidate.yml'
      - 'ops/platform-hosting-v1/**'
      - 'ops/platform-recovery-control-v1/**'
      - 'ops/platform-cloud-v6/contract.mjs'
      - 'tests/platform-hosting-v1.test.mjs'
      - 'tests/platform-hosting-release.test.mjs'
      - 'tests/platform-hosted-control-v6.test.mjs'
      - 'app/**'
      - 'components/**'
      - 'config/**'
      - 'db/**'
      - 'lib/**'
      - 'public/**'
      - 'types/**'
      - 'postcss.config.mjs'
      - 'tsconfig.json'
      - 'package*.json'
  pull_request:
    paths:
      - '.github/workflows/platform-hosting-candidate.yml'
      - 'ops/platform-hosting-v1/**'
      - 'ops/platform-recovery-control-v1/**'
      - 'ops/platform-cloud-v6/contract.mjs'
      - 'tests/platform-hosting-v1.test.mjs'
      - 'tests/platform-hosting-release.test.mjs'
      - 'tests/platform-hosted-control-v6.test.mjs'
      - 'app/**'
      - 'components/**'
      - 'config/**'
      - 'db/**'
      - 'lib/**'
      - 'public/**'
      - 'types/**'
      - 'postcss.config.mjs'
      - 'tsconfig.json'
      - 'package*.json'
permissions:
  contents: read
concurrency:
  group: platform-hosting-candidate-${{ github.sha }}
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix ops/cloud-worker --ignore-scripts --no-audit --no-fund
      - name: Hosting contracts, liveness and unchanged cloud closure
        run: node --experimental-strip-types --test tests/platform-hosting-v1.test.mjs tests/platform-hosting-release.test.mjs tests/platform-hosted-control-v6.test.mjs
      - name: Typecheck and scoped lint
        run: |
          node node_modules/typescript/bin/tsc --noEmit --incremental false
          node node_modules/eslint/bin/eslint.js ops/platform-hosting-v1/ app/api/health/route.ts tests/platform-hosting-v1.test.mjs tests/platform-hosting-release.test.mjs tests/platform-hosted-control-v6.test.mjs --max-warnings 0
      - name: Build exact tracked sources without local private files
        shell: bash
        run: |
          set -euo pipefail
          candidate_context=$(mktemp -d "${RUNNER_TEMP}/platform-hosting.XXXXXX")
          git archive HEAD | tar -x -C "$candidate_context"
          docker build --file "$candidate_context/ops/platform-hosting-v1/Dockerfile" --tag "techlong-platform-ci:${GITHUB_SHA}" "$candidate_context"
      - name: Non-root read-only container, anonymous GETs, network disabled
        shell: bash
        run: |
          set -euo pipefail
          candidate_name="techlong-platform-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker logs "$candidate_name"; docker rm --force "$candidate_name"' EXIT
          docker run --detach --name "$candidate_name" --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m --cap-drop ALL --security-opt no-new-privileges --pids-limit 256 --memory 1g --cpus 1 "techlong-platform-ci:${GITHUB_SHA}"
          test "$(docker exec "$candidate_name" id -u)" != 0
          docker exec "$candidate_name" node ops/platform-hosting-v1/smoke.mjs
      - name: Fixed HTTPS origin and ALB-header simulation, no database or TLS credentials
        shell: bash
        run: |
          set -euo pipefail
          candidate_name="techlong-platform-https-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker logs "$candidate_name"; docker rm --force "$candidate_name"' EXIT
          docker run --detach --name "$candidate_name" --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m --cap-drop ALL --security-opt no-new-privileges --pids-limit 256 --memory 1g --cpus 1 --env TECHLONG_PLATFORM_INGRESS=alb-https-v1 --env TECHLONG_PLATFORM_PUBLIC_ORIGIN=https://console.sandbox.techlong.cloud "techlong-platform-ci:${GITHUB_SHA}"
          test "$(docker exec "$candidate_name" id -u)" != 0
          docker exec "$candidate_name" node ops/platform-hosting-v1/https-smoke.mjs
      - name: Hosted controller bootstrap and expiry, no private bindings or AWS
        shell: bash
        run: |
          set -euo pipefail
          candidate_name="techlong-platform-hosted-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker logs "$candidate_name"; docker rm --force "$candidate_name"' EXIT
          docker run --detach --name "$candidate_name" --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m --cap-drop ALL --security-opt no-new-privileges --pids-limit 256 --memory 1g --cpus 1 --env CI=true --env GITHUB_ACTIONS=true --env GITHUB_SHA="$GITHUB_SHA" "techlong-platform-ci:${GITHUB_SHA}" node ops/platform-hosting-v1/hosted-smoke.mjs
          test "$(timeout 60s docker wait "$candidate_name")" = 0
          docker logs "$candidate_name" | grep --fixed-strings NODE_HOSTED_CONTROL_SMOKE_PASSED_NO_REAL_PRIVATE_BINDINGS
          docker logs "$candidate_name" | grep --fixed-strings PLATFORM_HOSTING_CONTROL_LEASE_CLOSED
      - name: Export the checked image with exact-source byte receipts, no registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP}/platform-web-image"
          mkdir "$artifact_dir"
          docker save "techlong-platform-ci:${GITHUB_SHA}" | gzip -1 > "$artifact_dir/image.tar.gz"
          docker image inspect "techlong-platform-ci:${GITHUB_SHA}" > "$artifact_dir/image-inspect.json"
          node ops/platform-hosting-v1/image-artifact.mjs seal "$artifact_dir"
      - name: Fresh OS HIGH and CRITICAL gate before candidate image upload
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/platform-web-image"
          scanner=$(mktemp -d "$RUNNER_TEMP/platform-candidate-trivy.XXXXXX")
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --tlsv1.2 https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_Linux-64bit.tar.gz --output "$scanner/trivy.tar.gz"
          echo "c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f  $scanner/trivy.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$scanner/trivy.tar.gz" --directory "$scanner" trivy
          touch "$scanner/empty.ignore"
          image_id=$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1])).imageConfigDigest)' "$artifact_dir/image-receipt.json")
          set +e
          (cd "$scanner" && env -i PATH="$PATH" HOME="$HOME" DOCKER_CONFIG="$scanner/docker-config" "$scanner/trivy" image --image-src docker --scanners vuln --pkg-types os --severity HIGH,CRITICAL --exit-code 1 --format json --list-all-pkgs --ignorefile "$scanner/empty.ignore" --cache-dir "$scanner/cache" --timeout 8m --output "$artifact_dir/os-scan.json" "$image_id")
          scan_exit=$?
          set -e
          node ops/platform-hosting-v1/security-scan.mjs "$artifact_dir" "$scanner/cache"
          test "$scan_exit" -eq 0
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1
        with:
          name: platform-web-image-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/platform-web-image/image.tar.gz
            ${{ runner.temp }}/platform-web-image/image-receipt.json
            ${{ runner.temp }}/platform-web-image/SHA256SUMS
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
          overwrite: false
      - name: Preserve small scan evidence even when image upload was refused
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: platform-web-security-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/platform-web-image/os-scan-summary.json
          if-no-files-found: warn
          retention-days: 3
          overwrite: false
