name: Platform image recovery candidate - No AWS
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/platform-image-recovery-candidate.yml'
      - 'ops/platform-image-recovery-v1/**'
      - 'ops/platform-image-recovery-v2/**'
      - 'tests/platform-image-recovery.test.mjs'
      - 'tests/platform-publisher-v2.test.mjs'
      - 'ops/platform-hosting-v1/image-foundation.mjs'
      - 'package*.json'
  pull_request:
    paths:
      - '.github/workflows/platform-image-recovery-candidate.yml'
      - 'ops/platform-image-recovery-v1/**'
      - 'ops/platform-image-recovery-v2/**'
      - 'tests/platform-image-recovery.test.mjs'
      - 'tests/platform-publisher-v2.test.mjs'
      - 'ops/platform-hosting-v1/image-foundation.mjs'
      - 'package*.json'
permissions:
  contents: read
concurrency:
  group: platform-image-recovery-candidate-${{ github.sha }}
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Recovery boundaries and immutable prior approval
        run: node --test tests/platform-image-recovery.test.mjs tests/platform-publisher-v2.test.mjs
      - name: Typecheck and scoped lint
        run: |
          node node_modules/typescript/bin/tsc --noEmit --incremental false
          node node_modules/eslint/bin/eslint.js ops/platform-image-recovery-v1/ ops/platform-image-recovery-v2/ tests/platform-image-recovery.test.mjs tests/platform-publisher-v2.test.mjs --max-warnings 0
