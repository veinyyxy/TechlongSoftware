name: Sealed plan PostgreSQL 18 proof
run-name: Sealed PG18 proof ${{ inputs.proof_label }}
on:
  workflow_dispatch:
    inputs:
      proof_label:
        description: Correlation label for this disposable proof
        type: string
        required: true
permissions:
  contents: read
jobs:
  sealed-plan-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: sealed-ci-only-bootstrap
          POSTGRES_DB: postgres
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22.19.0"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run real PostgreSQL 18.6 proof in an owned disposable database
        run: node ops/aws-sandbox/scripts/verify-f3b3-sealed-plan-pg16.mjs --github-pg18 --out artifacts/sealed-pg18
        env:
          SEALED_PLAN_PG_PORT: ${{ job.services.postgres.ports[5432] }}
          SEALED_PLAN_CI_PASSWORD: sealed-ci-only-bootstrap
      - name: Record exact service image and stop owned container
        if: always()
        env:
          SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          mkdir -p artifacts/sealed-pg18
          docker inspect "$SERVICE_ID" --format '{{json .Config.Image}}' > artifacts/sealed-pg18/service-image.json
          docker stop "$SERVICE_ID" > /dev/null
          docker inspect "$SERVICE_ID" --format '{{json .State.Running}}' > artifacts/sealed-pg18/service-running.json
          test "$(cat artifacts/sealed-pg18/service-running.json)" = false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sealed-pg18-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/sealed-pg18/
          if-no-files-found: error
          retention-days: 7
