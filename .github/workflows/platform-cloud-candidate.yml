permissions:
  contents: read
concurrency:
  group: platform-cloud-candidate-${{ github.sha }}
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: controller-ci-only-bootstrap
          POSTGRES_DB: postgres
        ports: ['5432/tcp']
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix ops/cloud-worker --ignore-scripts --no-audit --no-fund
      - name: Real bridge and publisher code with injected synthetic providers
        run: node --experimental-strip-types --test tests/platform-cloud-v6.test.mjs tests/platform-cloud-publisher-v6.test.mjs tests/platform-publisher-io-v6.test.mjs tests/platform-review-v6.test.mjs tests/platform-review-followup-v6.test.mjs tests/platform-activation-v6.test.mjs tests/platform-app-publication-v6.test.mjs tests/platform-binding-v6.test.mjs tests/cloud-worker-root-v5.test.mjs tests/platform-controller-v6.test.ts tests/platform-controller-github-v6.test.ts tests/platform-controller-transport-v6.test.mjs tests/platform-controller-auth-v6.test.mjs tests/platform-control-install-v6.test.mjs
      - name: Consolidated operator core with synthetic capabilities only
        run: |
          node --experimental-strip-types --test tests/platform-operations-credentials-v6.test.mjs tests/platform-operations-window-v6.test.mjs tests/platform-operations-evidence-v6.test.mjs
          node node_modules/eslint/bin/eslint.js ops/platform-operations-v6/ tests/platform-operations-credentials-v6.test.mjs tests/platform-operations-window-v6.test.mjs tests/platform-operations-evidence-v6.test.mjs tests/fixtures/platform-operations-v6.mjs --max-warnings 0
      - name: Transferred held task and HOSTED evidence handoff, no live capabilities
        run: |
          node --experimental-strip-types --test tests/platform-transferred-cycle-v6.test.mjs
          node --experimental-strip-types --test tests/platform-current-prepare-v6.test.mjs tests/platform-hosted-driver-v6.test.mjs
          node --experimental-strip-types --test tests/platform-cycle-v6.test.mjs tests/platform-cycle-transport-v6.test.mjs tests/platform-cycle-next-v6.test.mjs tests/platform-cycle-launch-v6.test.mjs
          node --experimental-strip-types --test tests/platform-operator-failure-v6.test.mjs tests/platform-recovery-preparation-v6.test.mjs
          node --experimental-strip-types --test tests/platform-successor-cycle-v6.test.mjs
          node node_modules/eslint/bin/eslint.js ops/platform-review-v6/successor-*.mjs tests/platform-successor-cycle-v6.test.mjs tests/fixtures/platform-successor-cycle-v6.mjs --max-warnings 0
          node node_modules/eslint/bin/eslint.js ops/platform-review-v6/operator-failure.mjs ops/platform-review-v6/cycle-reads.mjs ops/platform-review-v6/recovery-preparation.mjs tests/platform-operator-failure-v6.test.mjs tests/platform-recovery-preparation-v6.test.mjs --max-warnings 0
          node node_modules/eslint/bin/eslint.js ops/platform-review-v6/transferred-cycle.mjs ops/platform-review-v6/hosted-handoff.mjs tests/platform-transferred-cycle-v6.test.mjs --max-warnings 0
          node node_modules/eslint/bin/eslint.js ops/platform-review-v6/current-local.mjs ops/platform-review-v6/current-cloud.mjs ops/platform-review-v6/current-database.mjs ops/platform-review-v6/hosted-driver.mjs tests/platform-current-prepare-v6.test.mjs tests/platform-hosted-driver-v6.test.mjs --max-warnings 0
          node node_modules/eslint/bin/eslint.js ops/platform-review-v6/cycle-*.mjs tests/platform-cycle-v6.test.mjs tests/platform-cycle-transport-v6.test.mjs tests/platform-cycle-next-v6.test.mjs tests/platform-cycle-launch-v6.test.mjs tests/fixtures/platform-cycle-v6.mjs --max-warnings 0
      - name: Portable reviewed operator CLI with synthetic network and temporary files only
        run: |
          node --experimental-strip-types --test tests/platform-operator-v6.test.mjs tests/platform-operator-followup-v6.test.mjs
          node node_modules/eslint/bin/eslint.js ops/platform-operator-v6/ tests/platform-operator-v6.test.mjs tests/platform-operator-followup-v6.test.mjs --max-warnings 0
      - name: Retired unaccepted recovery candidate, no production capabilities
        run: |
          node --experimental-strip-types --test tests/platform-recovery-v1.test.mjs tests/platform-recovery-entry-bridge-v1.test.mjs tests/platform-recovery-cloud-v1.test.mjs tests/platform-recovery-control-v1.test.mjs
          node node_modules/eslint/bin/eslint.js ops/platform-recovery-v1/ ops/platform-recovery-cloud-v1/ ops/platform-recovery-control-v1/ tests/platform-recovery-v1.test.mjs tests/platform-recovery-entry-bridge-v1.test.mjs tests/platform-recovery-cloud-v1.test.mjs tests/platform-recovery-control-v1.test.mjs tests/fixtures/platform-recovery-v1.mjs tests/fixtures/platform-recovery-control-v1.mjs --max-warnings 0
      - name: Recovery trust-only publication profile, synthetic providers and no credentials
        run: |
          node --experimental-strip-types --test tests/platform-recovery-publication-v1.test.mjs
          node node_modules/eslint/bin/eslint.js ops/platform-recovery-publication-v1/ tests/platform-recovery-publication-v1.test.mjs --max-warnings 0
      - name: Recovery package single conditional upload, synthetic providers only
        run: |
          node --experimental-strip-types --test tests/platform-recovery-package-v1.test.mjs
          node node_modules/eslint/bin/eslint.js ops/platform-recovery-package-v1/ tests/platform-recovery-package-v1.test.mjs --max-warnings 0
      - name: Recovery source binding publication, synthetic providers and closed runtime only
        run: |
          node --experimental-strip-types --test tests/platform-recovery-binding-v1.test.mjs
          node node_modules/eslint/bin/eslint.js ops/platform-recovery-binding-v1/ tests/platform-recovery-binding-v1.test.mjs --max-warnings 0
      - name: Existing hosted window update and image-execution source compatibility, synthetic only
        run: |
          node --experimental-strip-types --test tests/platform-hosted-window-v6.test.mjs
          node --experimental-strip-types --test tests/platform-hosted-recovery-v6.test.mjs
          node --experimental-strip-types --test tests/platform-compatible-window-v6.test.mjs
          node --experimental-strip-types --test tests/platform-review-refresh-v6.test.mjs
          node node_modules/eslint/bin/eslint.js ops/platform-hosted-window-v6/ tests/platform-hosted-window-v6.test.mjs --max-warnings 0
          node node_modules/eslint/bin/eslint.js tests/platform-hosted-recovery-v6.test.mjs --max-warnings 0
          node node_modules/eslint/bin/eslint.js tests/platform-compatible-window-v6.test.mjs tests/fixtures/platform-review-resume-v6.mjs --max-warnings 0
          node node_modules/eslint/bin/eslint.js tests/platform-review-refresh-v6.test.mjs tests/fixtures/platform-review-refresh-v6.mjs scripts/ci/verify-platform-review-refresh-pg-v6.mjs --max-warnings 0
      - name: Atomic held-task transfer with synthetic capabilities only
        run: |
          node --experimental-strip-types --test tests/platform-task-transfer-v6.test.mjs tests/platform-task-transfer-entry-v6.test.mjs tests/platform-task-transfer-next-v6.test.mjs
          node node_modules/eslint/bin/eslint.js ops/platform-request-v6/transfer*.mjs ops/platform-request-v6/verify-transfer-pg.mjs tests/platform-task-transfer-v6.test.mjs tests/platform-task-transfer-entry-v6.test.mjs tests/platform-task-transfer-next-v6.test.mjs tests/fixtures/platform-task-transfer-v6.mjs tests/fixtures/platform-task-transfer-next-v6.mjs --max-warnings 0
      - name: Exact SQL and actual publisher queries on disposable PostgreSQL
        run: |
          node --experimental-strip-types scripts/ci/verify-platform-controller-pg-v6.mjs
          node --experimental-strip-types scripts/ci/verify-platform-cloud-publisher-pg-v6.mjs
          node --experimental-strip-types scripts/ci/verify-platform-review-refresh-pg-v6.mjs
          node --experimental-strip-types ops/platform-request-v6/verify-transfer-pg.mjs
        env:
          PLATFORM_CONTROL_CI_PORT: ${{ job.services.postgres.ports[5432] }}
      - name: Reviewed local launcher with synthetic I/O only
        run: |
          node --experimental-strip-types --test tests/platform-local-v6.test.mjs tests/platform-request-v6.test.mjs tests/platform-request-followup-v6.test.mjs tests/initialized-platform-v4.test.ts tests/local-deployment-platform.test.mjs
          node --experimental-strip-types scripts/ci/verify-platform-request-readback-v6.mjs
          node --experimental-strip-types scripts/ci/verify-platform-local-v6.mjs
          node --experimental-strip-types scripts/ci/verify-platform-local-v6.mjs request
          node node_modules/eslint/bin/eslint.js ops/platform-local-v6/ ops/platform-request-v6/ lib/deployments/reviewed-request-window-v6.ts lib/deployments/initialized-platform-management.ts lib/deployments/initialized-platform-http.ts components/admin/InitializedDeploymentPanel.tsx 'app/api/admin/instances/[instanceId]/initialized-deployment/route.ts' tests/platform-request-v6.test.mjs tests/platform-request-followup-v6.test.mjs tests/platform-local-v6.test.mjs scripts/ci/verify-platform-local-v6.mjs scripts/ci/verify-platform-request-readback-v6.mjs --max-warnings 0
        env:
          PLATFORM_CONTROL_CI_PORT: ${{ job.services.postgres.ports[5432] }}
      - name: Closed runtime and hosted-local lease candidates without private bindings
        run: |
          node --experimental-strip-types --experimental-loader ./tests/cloudflare-loader.mjs --test tests/platform-controller-runtime-v6.test.mjs tests/platform-controller-hosted-v6.test.mjs
          node node_modules/eslint/bin/eslint.js tests/platform-controller-hosted-v6.test.mjs --max-warnings 0
      - run: node node_modules/typescript/bin/tsc --noEmit --incremental false
      - run: node node_modules/eslint/bin/eslint.js ops/platform-cloud-v6/ ops/platform-controller-review-v6/ ops/platform-publisher-v6/ ops/platform-review-v6/ ops/platform-activation-v6/ ops/platform-publication-v6/ ops/platform-binding-v6/ lib/deployments/controller-v6/ components/admin/DeploymentControlPanel.tsx tests/platform-cloud*v6.test.mjs tests/platform-control-install-v6.test.mjs tests/platform-publisher-io-v6.test.mjs tests/platform-review-v6.test.mjs tests/platform-review-followup-v6.test.mjs tests/platform-activation-v6.test.mjs tests/platform-app-publication-v6.test.mjs tests/platform-binding-v6.test.mjs tests/platform-controller-transport-v6.test.mjs tests/fixtures/platform-controller-transport-v6.mjs tests/fixtures/platform-cloud-v6.mjs scripts/ci/verify-platform-cloud-publisher-pg-v6.mjs --max-warnings 0
      - run: npm run build
