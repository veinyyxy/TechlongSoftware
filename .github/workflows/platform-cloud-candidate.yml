name: Platform cloud bridge candidate - No AWS
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/platform-cloud-candidate.yml'
      - 'ops/platform-cloud-v6/**'
      - 'tests/platform-cloud*v6*'
      - 'tests/fixtures/platform-cloud-v6.mjs'
      - 'scripts/ci/verify-platform-cloud-publisher-pg-v6.mjs'
      - 'ops/platform-controller-v6/**'
      - 'lib/deployments/controller-v6/**'
  pull_request:
    paths:
      - '.github/workflows/platform-cloud-candidate.yml'
      - 'ops/platform-cloud-v6/**'
      - 'tests/platform-cloud*v6*'
      - 'tests/fixtures/platform-cloud-v6.mjs'
      - 'scripts/ci/verify-platform-cloud-publisher-pg-v6.mjs'
      - 'ops/platform-controller-v6/**'
      - 'lib/deployments/controller-v6/**'
permissions:
  contents: read
concurrency:
  group: platform-cloud-candidate-${{ github.sha }}
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: controller-ci-only-bootstrap
          POSTGRES_DB: postgres
        ports: ['5432/tcp']
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix ops/cloud-worker --ignore-scripts --no-audit --no-fund
      - name: Real bridge and publisher code with injected synthetic providers
        run: node --experimental-strip-types --test tests/platform-cloud-v6.test.mjs tests/platform-cloud-publisher-v6.test.mjs tests/cloud-worker-root-v5.test.mjs tests/platform-controller-v6.test.ts tests/platform-controller-github-v6.test.ts tests/platform-controller-auth-v6.test.mjs
      - name: Exact SQL and actual publisher queries on disposable PostgreSQL
        run: |
          node --experimental-strip-types scripts/ci/verify-platform-controller-pg-v6.mjs
          node --experimental-strip-types scripts/ci/verify-platform-cloud-publisher-pg-v6.mjs
        env:
          PLATFORM_CONTROL_CI_PORT: ${{ job.services.postgres.ports[5432] }}
      - name: Unpublished platform still never reads runtime credentials
        run: node --experimental-strip-types --experimental-loader ./tests/cloudflare-loader.mjs --test tests/platform-controller-runtime-v6.test.mjs
      - run: node node_modules/typescript/bin/tsc --noEmit --incremental false
      - run: node node_modules/eslint/bin/eslint.js ops/platform-cloud-v6/ tests/platform-cloud*v6.test.mjs tests/fixtures/platform-cloud-v6.mjs scripts/ci/verify-platform-cloud-publisher-pg-v6.mjs --max-warnings 0
      - run: npm run build
