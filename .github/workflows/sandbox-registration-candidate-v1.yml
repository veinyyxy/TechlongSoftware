name: Sandbox registration candidate - No AWS
run-name: Sandbox registration candidate ${{ inputs.recipe_sha }}
on:
  workflow_dispatch:
    inputs:
      recipe_sha:
        description: Reviewed two-file source recipe SHA-256
        type: string
        required: true
      orchestration_sha:
        description: Exact main commit containing this build workflow
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: sandbox-registration-06d91b3e-candidate
  cancel-in-progress: false
jobs:
  candidate:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1 && github.repository_id == '1323312747' && github.sha == inputs.orchestration_sha && inputs.recipe_sha == '06d91b3eb875568af5d3f9b9a9015d9a949571dc0ec8427b0ad2e764bbd8c720'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.19.0'
      - name: Construct and verify the exact two-file source overlay
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          stage="$RUNNER_TEMP/registration-overlay"
          node ops/platform-registration-candidate-v1/candidate.mjs source "$stage"
          mkdir "$stage/context" "$stage/artifact"
          tar --extract --file "$stage/source.tar" --directory "$stage/context"
          cp "$stage/source-proof.json" "$stage/artifact/source-proof.json"
      - name: Build one image from the original Dockerfile, no registry publish
        shell: bash
        run: |
          set -euo pipefail
          context="$RUNNER_TEMP/registration-overlay/context"
          docker build --platform linux/amd64 --file "$context/ops/platform-hosting-v1/Dockerfile" \
            --tag "techlong-registration-candidate:$GITHUB_RUN_ID" "$context"
      - name: Disabled controls and anonymous registration form, network none
        shell: bash
        run: |
          set -euo pipefail
          image="techlong-registration-candidate:$GITHUB_RUN_ID"
          plain="registration-plain-$GITHUB_RUN_ID"
          alb="registration-alb-$GITHUB_RUN_ID"
          trap 'docker rm --force "$plain" "$alb" >/dev/null 2>&1 || true' EXIT
          sandbox=(--detach --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m --cap-drop ALL --security-opt no-new-privileges --pids-limit 256 --memory 1g --cpus 1)
          closed=(--env AWS_INITIALIZED_REQUESTS_ENABLED=false --env DEPLOYMENT_WORKER_ENABLED=false --env AWS_APPLY_ENABLED=false --env TECHLONG_PLATFORM_CONTROLLER_ENABLED=false --env TECHLONG_PLATFORM_CONTROL_LOCAL=false --env TECHLONG_PLATFORM_CONTROL_HOSTED=false --env TECHLONG_PLATFORM_CONTROLLER_LEASE= --env TECHLONG_PLATFORM_REQUEST_WINDOW_V6=)
          docker run "${sandbox[@]}" "${closed[@]}" --name "$plain" "$image"
          test "$(docker exec "$plain" id -u)" != 0
          docker exec "$plain" node ops/platform-hosting-v1/smoke.mjs
          docker run "${sandbox[@]}" "${closed[@]}" --name "$alb" --env TECHLONG_PLATFORM_INGRESS=alb-https-v1 \
            --env TECHLONG_PLATFORM_PUBLIC_ORIGIN=https://console.sandbox.techlong.cloud "$image"
          test "$(docker exec "$alb" id -u)" != 0
          docker exec "$alb" node ops/platform-hosting-v1/https-smoke.mjs
          docker exec "$alb" node --input-type=module -e '
            import assert from "node:assert/strict";
            import { request } from "node:http";
            import { CLOSED_BINDINGS } from "./ops/platform-hosting-v1/contract.mjs";
            for (const [k,v] of Object.entries(CLOSED_BINDINGS)) assert.equal(process.env[k],v);
            assert.equal(process.env.DATABASE_URL,undefined);
            const html = await new Promise((resolve,reject)=>{
              const req=request({hostname:"127.0.0.1",port:3000,method:"GET",path:"/register",timeout:5000,
                headers:{host:"console.sandbox.techlong.cloud","x-forwarded-proto":"https","x-forwarded-port":"443"}},res=>{
                if(res.statusCode!==200){res.resume();reject(Error("REGISTRATION_FORM_HTTP"));return;}
                let text="";res.setEncoding("utf8");res.on("data",c=>{text+=c; if(text.length>1024*1024) req.destroy(Error("REGISTRATION_FORM_LIMIT"));});
                res.on("end",()=>resolve(text));
              });req.on("error",reject);req.on("timeout",()=>req.destroy(Error("REGISTRATION_FORM_TIMEOUT")));req.end();
            });
            assert.match(html,/企业名称/);assert.match(html,/workspaceName/);
            console.log("SANDBOX_REGISTRATION_FORM_GET_ONLY_PASSED");'
      - name: Preserve the image archive and enforce the fresh HIGH/CRITICAL OS gate
        shell: bash
        env:
          REVIEWED_ORCHESTRATION_SHA: ${{ inputs.orchestration_sha }}
        run: |
          set -euo pipefail
          image="techlong-registration-candidate:$GITHUB_RUN_ID"
          artifact="$RUNNER_TEMP/registration-overlay/artifact"
          scanner=$(mktemp -d "$RUNNER_TEMP/registration-trivy.XXXXXX")
          docker save "$image" | gzip -1 > "$artifact/image.tar.gz"
          docker image inspect "$image" > "$artifact/image-inspect.json"
          image_id=$(docker image inspect --format '{{.Id}}' "$image")
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
            https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_Linux-64bit.tar.gz --output "$scanner/trivy.tar.gz"
          echo "c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f  $scanner/trivy.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$scanner/trivy.tar.gz" --directory "$scanner" trivy
          touch "$scanner/empty.ignore"
          set +e
          (cd "$scanner" && env -i PATH="$PATH" DOCKER_CONFIG="$scanner/docker-config" "$scanner/trivy" image \
            --image-src docker --scanners vuln --pkg-types os --severity HIGH,CRITICAL --exit-code 1 --format json --list-all-pkgs \
            --ignorefile "$scanner/empty.ignore" --cache-dir "$scanner/cache" --timeout 8m --output "$artifact/os-scan.json" "$image_id")
          scan_exit=$?
          set -e
          node ops/platform-registration-candidate-v1/candidate.mjs seal "$artifact" "$scanner/cache"
          test "$scan_exit" -eq 0
      - name: Upload only sealed candidate evidence to GitHub
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: sandbox-registration-overlay-06d91b3e-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/registration-overlay/artifact/image.tar.gz
            ${{ runner.temp }}/registration-overlay/artifact/image-receipt.json
            ${{ runner.temp }}/registration-overlay/artifact/os-scan-summary.json
            ${{ runner.temp }}/registration-overlay/artifact/SHA256SUMS
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
          overwrite: false
