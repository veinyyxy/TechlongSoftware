name: Sandbox registration single ECR publication v1
run-name: Sandbox registration ECR ${{ inputs.review_sha }}
on:
  workflow_dispatch:
    inputs:
      review_json:
        description: Exact Source-generated publication review
        required: true
        type: string
      review_sha:
        description: SHA256 of exact review JSON bytes
        required: true
        type: string
permissions: {}
jobs:
  reviewed-publication:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1 && github.repository_id == '1323312747' && fromJSON(inputs.review_json).candidate.artifactId == 14444752398
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: veinyyxy/TechlongSoftware/.github/workflows/sandbox-registration-image-publish-job-v1.yml@0b076037eaf04f9a47957548ebe36a454546d641
    with:
      review_json: ${{ inputs.review_json }}
      review_sha: ${{ inputs.review_sha }}
  reviewed-first-purchase-publication:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1 && github.repository_id == '1323312747' && fromJSON(inputs.review_json).candidate.artifactId == 14480476839
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: veinyyxy/TechlongSoftware/.github/workflows/sandbox-registration-image-publish-job-v1.yml@d169811bfdb68f62bc1e3fad7dcea9f58f8a0423
    with:
      review_json: ${{ inputs.review_json }}
      review_sha: ${{ inputs.review_sha }}
  reviewed-checkout-repair-publication:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1 && github.repository_id == '1323312747' && fromJSON(inputs.review_json).candidate.artifactId == 14491468132
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: veinyyxy/TechlongSoftware/.github/workflows/sandbox-registration-image-publish-job-v1.yml@200ca52348a2ba57f52cfdd445051012eb0dddd6
    with:
      review_json: ${{ inputs.review_json }}
      review_sha: ${{ inputs.review_sha }}
  reviewed-billing-repair-publication:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1 && github.repository_id == '1323312747' && fromJSON(inputs.review_json).candidate.artifactId == 14495028924
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: veinyyxy/TechlongSoftware/.github/workflows/sandbox-registration-image-publish-job-v1.yml@89230b2628d9719157f0a79d7ab27e5a1c091728
    with:
      review_json: ${{ inputs.review_json }}
      review_sha: ${{ inputs.review_sha }}
  reviewed-buyer-forward-publication:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1 && github.repository_id == '1323312747' && github.sha == fromJSON(inputs.review_json).dispatchCommit && fromJSON(inputs.review_json).candidate.artifactId == 14714442097 && fromJSON(inputs.review_json).reusableCommit == 'a3f1cefcd72246e76c9a1b46634dc4da4a90d75f'
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: veinyyxy/TechlongSoftware/.github/workflows/sandbox-registration-image-publish-job-v1.yml@a3f1cefcd72246e76c9a1b46634dc4da4a90d75f
    with:
      review_json: ${{ inputs.review_json }}
      review_sha: ${{ inputs.review_sha }}
