name: Platform ECS access and hosting draft - No AWS
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/platform-ecs-access-candidate.yml'
      - 'ops/platform-ecs-v1/**'
      - 'tests/platform-ecs-v1.test.mjs'
      - 'docs/aws-platform-hosting-w7n-access-review.md'
      - 'docs/aws-platform-hosting-w7n-two-hour-draft.md'
  pull_request:
    paths:
      - '.github/workflows/platform-ecs-access-candidate.yml'
      - 'ops/platform-ecs-v1/**'
      - 'tests/platform-ecs-v1.test.mjs'
      - 'docs/aws-platform-hosting-w7n-access-review.md'
      - 'docs/aws-platform-hosting-w7n-two-hour-draft.md'
permissions:
  contents: read
concurrency:
  group: platform-ecs-access-${{ github.sha }}
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Exact access and hosting draft contracts - No AWS
        run: node --test tests/platform-ecs-v1.test.mjs
      - run: npx tsc --noEmit
      - run: npx eslint ops/platform-ecs-v1 tests/platform-ecs-v1.test.mjs
