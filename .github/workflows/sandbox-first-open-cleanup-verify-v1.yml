name: Sandbox first open — cleanup identity verify only
on:
  workflow_call:
    inputs:
      intent_sha: { type: string, required: true }
      installation_sha: { type: string, required: true }
permissions:
  contents: read
  id-token: write
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && github.repository_id == '1323312747' && github.repository_owner_id == '14145707' && github.actor_id == '14145707'
    environment: techlong-sandbox-deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check exact dispatch and protected binding coordinates
        shell: bash
        env:
          INTENT: ${{ inputs.intent_sha }}
          INSTALLATION: ${{ inputs.installation_sha }}
          BINDING: ${{ vars.TECHLONG_FIRST_OPEN_CLEANUP_VERIFY_SHA }}
          COMMIT: ${{ vars.TECHLONG_FIRST_OPEN_CLEANUP_VERIFY_COMMIT }}
        run: |
          [[ "$INTENT" =~ ^[a-f0-9]{64}$ && "$INSTALLATION" =~ ^[a-f0-9]{64}$ ]]
          [[ "$BINDING" =~ ^[a-f0-9]{64}$ && "$COMMIT" =~ ^[a-f0-9]{40}$ ]]
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ vars.TECHLONG_FIRST_OPEN_CLEANUP_VERIFY_COMMIT }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.19.0'
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: veinyyxy/SpeedFeast_Backend_main
          ref: b9ca2138738900afc23a6a2ddce141b37a1f0a31
          token: ${{ secrets.TECHLONG_FIRST_OPEN_BACKEND_READ_TOKEN }}
          path: .first-open-backend
          persist-credentials: false
      - name: Load pinned dependencies
        shell: bash
        run: |
          test "$(git -C .first-open-backend rev-parse HEAD)" = b9ca2138738900afc23a6a2ddce141b37a1f0a31
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix .first-open-backend --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Verify dedicated session and fixed read-only SQL
        env:
          FIRST_OPEN_CLEANUP_PERMIT: ${{ vars.TECHLONG_FIRST_OPEN_CLEANUP_VERIFY_PERMIT }}
          FIRST_OPEN_CLEANUP_SHA: ${{ vars.TECHLONG_FIRST_OPEN_CLEANUP_VERIFY_SHA }}
          FIRST_OPEN_CLEANUP_COMMIT: ${{ vars.TECHLONG_FIRST_OPEN_CLEANUP_VERIFY_COMMIT }}
          FIRST_OPEN_CLEANUP_REQUESTED_INTENT: ${{ inputs.intent_sha }}
          FIRST_OPEN_CLEANUP_REQUESTED_INSTALLATION: ${{ inputs.installation_sha }}
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types ops/aws-sandbox/first-open-entry/cleanup-verify.ts
      - name: Save the sanitized read-only receipt
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: fc41597f-cleanup-verify-${{ inputs.intent_sha }}
          path: ${{ runner.temp }}/fc41597f-cleanup-verify.json
          if-no-files-found: error
          retention-days: 1
          overwrite: false
