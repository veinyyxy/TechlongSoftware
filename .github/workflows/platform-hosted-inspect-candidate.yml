name: Platform hosted read-only ECS defaults inspection - No AWS
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/platform-hosted-inspect-candidate.yml'
      - 'ops/platform-hosted-deploy-v6/inspect-defaults.mjs'
      - 'tests/platform-hosted-defaults-inspect.test.mjs'
  pull_request:
    paths:
      - '.github/workflows/platform-hosted-inspect-candidate.yml'
      - 'ops/platform-hosted-deploy-v6/inspect-defaults.mjs'
      - 'tests/platform-hosted-defaults-inspect.test.mjs'
permissions:
  contents: read
concurrency:
  group: platform-hosted-inspect-${{ github.sha }}
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Read-only ECS defaults and original contracts - No AWS
        run: node --experimental-strip-types --test tests/platform-hosted-defaults-inspect.test.mjs tests/platform-hosted-deploy-v6.test.mjs
      - name: Typecheck and scoped lint
        run: |
          node node_modules/typescript/bin/tsc --noEmit --incremental false
          node node_modules/eslint/bin/eslint.js ops/platform-hosted-deploy-v6/inspect-defaults.mjs tests/platform-hosted-defaults-inspect.test.mjs --max-warnings 0
