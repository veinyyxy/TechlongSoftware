name: Platform hosted deployment - No AWS
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/platform-hosted-deploy-candidate.yml'
      - 'ops/platform-hosted-deploy-v6/**'
      - 'tests/platform-hosted-deploy-v6.test.mjs'
      - 'docs/aws-auto-deployment-platform-w8g-hosting-review.md'
  pull_request:
    paths:
      - '.github/workflows/platform-hosted-deploy-candidate.yml'
      - 'ops/platform-hosted-deploy-v6/**'
      - 'tests/platform-hosted-deploy-v6.test.mjs'
      - 'docs/aws-auto-deployment-platform-w8g-hosting-review.md'
permissions:
  contents: read
concurrency:
  group: platform-hosted-deploy-${{ github.sha }}
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Hosted deployment contracts - No AWS
        run: node --experimental-strip-types --test tests/platform-hosted-deploy-v6.test.mjs tests/platform-hosting-deploy-v1.test.mjs tests/platform-hosting-trial-v2.test.mjs tests/platform-hosted-access-v6.test.mjs
      - name: Typecheck and scoped lint
        run: |
          node node_modules/typescript/bin/tsc --noEmit --incremental false
          node node_modules/eslint/bin/eslint.js ops/platform-hosted-deploy-v6/ tests/platform-hosted-deploy-v6.test.mjs --max-warnings 0
