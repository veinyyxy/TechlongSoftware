name: Temporary CFN environment tool - No AWS
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aws-environment-cfn.yml'
      - 'ops/temporary-idle/**'
      - 'ops/aws-resource-power/**'
      - 'ops/deployment-baseline/**'
      - 'scripts/aws-environment.mjs'
      - 'tests/aws-environment*.mjs'
      - 'tests/aws-resource-power.test.mjs'
      - 'tests/temporary-idle.test.mjs'
      - 'tests/deployment-baseline.test.mjs'
      - 'package*.json'
permissions:
  contents: read
concurrency:
  group: aws-environment-cfn-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Synthetic AWS lifecycle and original baseline regression only
        run: node --test --test-timeout=30000 tests/aws-environment.test.mjs tests/aws-resource-power.test.mjs tests/temporary-idle.test.mjs tests/deployment-baseline.test.mjs
      - name: Scoped lint
        run: node node_modules/eslint/bin/eslint.js ops/temporary-idle/environment*.mjs ops/temporary-idle/core.mjs ops/aws-resource-power/core.mjs tests/aws-environment*.mjs tests/aws-resource-power.test.mjs tests/temporary-idle.test.mjs --max-warnings 0
      - run: node node_modules/typescript/bin/tsc --noEmit --incremental false
